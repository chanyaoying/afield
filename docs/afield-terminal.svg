<svg xmlns="http://www.w3.org/2000/svg" width="762" height="412" viewBox="0 0 762 412" role="img" aria-label="afield status and afield list in a terminal">
<rect width="762" height="412" rx="10" fill="#0d1117"/>
<rect width="762" height="34" rx="10" fill="#161b22"/><rect y="24" width="762" height="10" fill="#161b22"/>
<circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/>
<text x="381.0" y="22" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" text-anchor="middle">ssh server</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" xml:space="preserve">
<text x="20" y="62"><tspan fill="#7ee787">you@server</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#e6edf3">afield status</tspan></text>
<text x="20" y="82"><tspan fill="#e6edf3">all         afield.target                  </tspan><tspan fill="#56d364">active</tspan></text>
<text x="20" y="102"><tspan fill="#e6edf3">server      afield.service                 </tspan><tspan fill="#56d364">active</tspan><tspan fill="#e6edf3">, 0 automatic restarts in the last hour</tspan></text>
<text x="20" y="122"><tspan fill="#e6edf3">tmux        afield-tmux.service            </tspan><tspan fill="#56d364">active</tspan></text>
<text x="20" y="142"><tspan fill="#e6edf3">supervisor  afield-supervisor.service      </tspan><tspan fill="#56d364">active</tspan></text>
<text x="20" y="162"><tspan fill="#e6edf3">glasses     even-terminal.service          </tspan><tspan fill="#56d364">active</tspan><tspan fill="#e6edf3">, port 3456 up</tspan></text>
<text x="20" y="182"><tspan fill="#e6edf3">memory      1.9 GB of 8 GB (no new reopens above 5 GB)</tspan></text>
<text x="20" y="202"><tspan fill="#e6edf3">sessions    4 running, 4 kept open, at most 6 at once</tspan></text>
<text x="20" y="222"><tspan fill="#e6edf3">contracts   </tspan><tspan fill="#56d364">ok (22 pass)</tspan><tspan fill="#8b949e"> · claude 2.1.328 · even-terminal 0.10.5</tspan></text>
<text x="20" y="242"><tspan fill="#e6edf3"></tspan></text>
<text x="20" y="262"><tspan fill="#7ee787">you@server</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#e6edf3">afield list</tspan></text>
<text x="20" y="282"><tspan fill="#e3b341">3f9a1c2e  </tspan><tspan fill="#e6edf3">Refactor billing service        </tspan><tspan fill="#79c0ff">terminal+phone+glasses, </tspan><tspan fill="#e3b341">busy</tspan><tspan fill="#8b949e">         402 MB</tspan></text>
<text x="20" y="302"><tspan fill="#e3b341">8b27d410  </tspan><tspan fill="#e6edf3">Draft conference talk           </tspan><tspan fill="#79c0ff">terminal+phone+glasses, </tspan><tspan fill="#56d364">idle</tspan><tspan fill="#8b949e">         311 MB</tspan></text>
<text x="20" y="322"><tspan fill="#e3b341">c41e9b07  </tspan><tspan fill="#e6edf3">Fix flaky CI on main            </tspan><tspan fill="#79c0ff">terminal+phone+glasses, </tspan><tspan fill="#56d364">idle</tspan><tspan fill="#8b949e">         287 MB</tspan></text>
<text x="20" y="342"><tspan fill="#e3b341">e06d5a93  </tspan><tspan fill="#e6edf3">Plan weekend trip               </tspan><tspan fill="#79c0ff">terminal+phone+glasses, </tspan><tspan fill="#e3b341">waiting</tspan><tspan fill="#8b949e">      254 MB</tspan></text>
<text x="20" y="362"><tspan fill="#e6edf3"></tspan></text>
<text x="20" y="382"><tspan fill="#7ee787">you@server</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#e6edf3">█</tspan></text>
</g>
</svg>
